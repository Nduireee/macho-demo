<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macho: independent site checks for your build in Kenya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EAE7; --surface:#FFFFFF; --ink:#16212B; --muted:#4A5661; --line:#A9B2B9; --line-soft:#D3D9DC;
  --sign:#FFC20E; --navy:#1E3A5F; --navy-ink:#FFFFFF; --ok:#1C7343; --ok-bg:#DFF0E5; --bad:#B42318; --bad-bg:#FBE3DF;
  --soft:#DFE7EF; --focus:#1F6FEB;
  --body:"Atkinson Hyperlegible", Verdana, "Segoe UI", sans-serif;
  --head:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10171E; --surface:#19232D; --ink:#EEF2F5; --muted:#AEB9C3; --line:#53616E; --line-soft:#2D3945;
    --navy:#2F5D93; --ok:#5ACB8E; --ok-bg:#163226; --bad:#FF8C7C; --bad-bg:#3C1D19; --soft:#22344A; --focus:#8AB8FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10171E; --surface:#19232D; --ink:#EEF2F5; --muted:#AEB9C3; --line:#53616E; --line-soft:#2D3945;
  --navy:#2F5D93; --ok:#5ACB8E; --ok-bg:#163226; --bad:#FF8C7C; --bad-bg:#3C1D19; --soft:#22344A; --focus:#8AB8FF; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2,h3{margin:0;font-family:var(--head);font-weight:700;line-height:1.1;letter-spacing:.005em}
p{margin:0}
img{max-width:100%;display:block}
.ic{flex:none;vertical-align:middle}
.muted{color:var(--muted)}
.small{font-size:.92rem}
.tiny{font-size:.82rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
.top-inner{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-align:left}
.brand-mark{width:44px;height:44px;border-radius:6px;background:var(--sign);color:#16212B;display:grid;place-items:center}
.brand-name{font-family:var(--head);font-weight:700;font-size:1.9rem;line-height:1}
.brand-tag{display:block;font-size:.85rem;color:var(--muted);font-family:var(--body)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.who-chip{display:flex;align-items:center;gap:8px;font-weight:700}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:.9rem;font-weight:700}
.hazard{height:8px;background:repeating-linear-gradient(-45deg,var(--sign) 0 10px,#16212B 10px 20px)}
.proto{background:var(--navy);color:var(--navy-ink);font-size:.92rem}
.proto-inner{max-width:1200px;margin:0 auto;padding:8px 20px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.proto button{font:inherit;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:3px 10px;cursor:pointer}
.proto button[aria-current="true"]{background:var(--sign);color:#16212B;border-color:var(--sign);font-weight:700}
@media (max-width:560px){.brand-tag{display:none}.who-name{display:none}.tr-label{display:none}.top-inner{flex-wrap:nowrap}}

.wrap{max-width:1200px;margin:0 auto;padding:28px 20px 64px}

/* Buttons */
.btn{font-family:var(--body);font-weight:700;font-size:1.02rem;min-height:52px;padding:11px 20px;border-radius:6px;border:2px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;line-height:1.2}
.btn.sign{background:var(--sign);border-color:var(--sign);color:#16212B}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.wide{width:100%}
.btn.small-btn{min-height:42px;padding:7px 14px;font-size:.95rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.back{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:700;background:none;border:0;color:var(--ink);padding:6px 0;cursor:pointer;margin-bottom:14px;text-decoration:underline;text-underline-offset:4px}

/* Cards */
.card{background:var(--surface);border:2px solid var(--line-soft);border-radius:6px;padding:22px}
.card h2{font-size:1.6rem;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.next{border-color:var(--sign);border-width:3px}
.next h2{font-size:1.75rem}
.callout{border-radius:6px;padding:14px 16px;background:var(--soft);margin:14px 0;display:flex;gap:12px;align-items:flex-start}
.callout.ok{background:var(--ok-bg)}
.callout.bad{background:var(--bad-bg)}
.callout p{margin-top:2px}
.hint{margin-top:14px;font-size:.92rem;color:var(--muted)}
.bar{height:10px;background:var(--line-soft);border-radius:5px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.85rem;font-weight:700;padding:3px 10px;border-radius:4px;white-space:nowrap;background:var(--soft);color:var(--ink)}
.pill.pass{background:var(--ok-bg);color:var(--ok)}
.pill.issue{background:var(--bad-bg);color:var(--bad)}
.pill.wait{background:var(--sign);color:#16212B}

/* Home */
.hello{font-size:clamp(2.2rem,4.5vw,3.2rem)}
.hello-sub{margin-top:6px;font-size:1.1rem;color:var(--muted)}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-top:26px}
.pcard{padding:0;overflow:hidden;display:flex;flex-direction:column}
.pthumb{aspect-ratio:16/10;width:100%;object-fit:cover;border-bottom:2px solid var(--line-soft)}
.pbody{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.pbody h2{font-size:1.65rem;margin:0}
.loc{display:flex;align-items:center;gap:6px;color:var(--muted)}
.stage-line{font-weight:700}
.money-line{font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.action{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;background:var(--soft);font-weight:700;margin-top:4px}
.action.wait{background:var(--sign);color:#16212B}
.action.ok{background:var(--ok-bg);color:var(--ok)}
.pcard .btn{margin-top:auto}
.pbody .spacer{flex:1}
.addcard{border-style:dashed;border-color:var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;min-height:300px}
.addcard .plus{width:64px;height:64px;border-radius:50%;background:var(--bg);display:grid;place-items:center}

/* Project page */
.proj{display:flex;flex-direction:column;gap:20px}
.col{display:contents}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}
@media (min-width:980px){
  .proj{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
  .col{display:flex;flex-direction:column;gap:20px}
}

/* The site signboard */
.board{background:#fff;color:#111;border:3px solid #111;border-radius:2px;position:relative;margin-bottom:30px}
.board::before,.board::after{content:"";position:absolute;bottom:-29px;width:12px;height:26px;background:#5D6064}
.board::before{left:16%}
.board::after{right:16%}
.board-head{background:#111;color:#fff;padding:12px 18px;font-family:var(--head);font-weight:700;font-size:clamp(1.45rem,2.6vw,1.9rem);text-transform:uppercase;letter-spacing:.02em;line-height:1.08}
.board dl{margin:0;display:grid;grid-template-columns:max-content 1fr}
.board dt,.board dd{margin:0;padding:9px 16px;border-top:1.5px solid #111}
.board dt{font-family:var(--head);font-weight:700;text-transform:uppercase;font-size:1rem;letter-spacing:.02em;border-right:1.5px solid #111;background:#F1F1EE}
.board .verified{grid-column:1 / -1;background:var(--sign);display:flex;gap:10px;align-items:center;font-weight:700;padding:10px 16px;border-top:1.5px solid #111}
@media (max-width:480px){.board dl{grid-template-columns:1fr}.board dt{border-right:0;padding-bottom:2px}.board dd{border-top:0;padding-top:0}}

/* House viewer */
.viewer{margin:0;border:2px solid var(--line-soft);border-radius:6px;overflow:hidden;position:relative;background:var(--bg)}
.viewer img{width:100%;aspect-ratio:16/10;object-fit:cover}
.viewer.ghost img{opacity:.35;filter:grayscale(1)}
.ghost-tag{position:absolute;top:14px;left:14px;background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:4px;padding:4px 10px;font-weight:700}
.viewer figcaption{padding:12px 16px;background:var(--surface);border-top:2px solid var(--line-soft)}
.viewer figcaption strong{display:block;font-size:1.08rem}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
@media (max-width:560px){.strip{grid-template-columns:repeat(2,1fr)}}
.shot{font:inherit;color:inherit;text-align:left;background:var(--surface);border:2px solid var(--line-soft);border-radius:6px;padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.shot img{aspect-ratio:16/10;width:100%;object-fit:cover}
.shot[data-state="future"] img{opacity:.3;filter:grayscale(1)}
.shot[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.shot-label{display:flex;gap:6px;align-items:baseline;padding:7px 9px 0;font-weight:700;font-size:.92rem;line-height:1.2}
.shot-st{padding:2px 9px 8px;font-size:.8rem;color:var(--muted)}
.shot[data-state="done"] .shot-st{color:var(--ok);font-weight:700}
.shot[data-state="partial"] .shot-st{color:var(--ink);font-weight:700}

/* Stages */
.stages{list-style:none;margin:0;padding:0}
.stages li + li{margin-top:8px}
.stage{width:100%;font:inherit;color:inherit;text-align:left;display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:12px 14px;background:var(--surface);border:2px solid var(--line-soft);border-radius:6px;cursor:pointer}
.stage:hover{border-color:var(--ink)}
.num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:1.3rem;border:2.5px dashed var(--line);color:var(--muted)}
.stage[data-s="released"] .num{background:var(--ok);border:0;color:#fff}
.stage[data-s="ready"]{border-color:var(--sign);border-width:3px}
.stage[data-s="ready"] .num{background:var(--sign);border:0;color:#16212B}
.stage.busy .num{border:0;color:#16212B;background:repeating-linear-gradient(-45deg,var(--sign) 0 6px,#E9EAE6 6px 12px)}
.st-name{display:block;font-weight:700;font-size:1.05rem}
.st-status{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted)}
.stage[data-s="released"] .st-status{color:var(--ok)}
.st-amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;font-size:.98rem}
.stage[data-s="upcoming"] .st-name,.stage[data-s="upcoming"] .st-amt{color:var(--muted)}

.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1.5px solid var(--line-soft)}
.rows li:first-child{border-top:0}
.r-main{display:flex;gap:12px;align-items:flex-start;min-width:0}
.r-title{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--bg);border-radius:6px;padding:12px}
.stat strong{display:block;font-family:var(--head);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
.plain{margin:8px 0 0;padding-left:22px}
.plain li{margin:5px 0}
.empty-msg{color:var(--muted);padding:8px 0}

/* Report */
.rep-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1.5px solid var(--line-soft);margin-bottom:14px}
.report h3{font-size:1.35rem;margin:24px 0 10px;display:flex;align-items:center;gap:10px}
.rep-prog{display:flex;justify-content:space-between;margin-bottom:6px}
.rep-list{list-style:none;margin:0;padding:0}
.rep-list li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 0;border-top:1.5px solid var(--line-soft);align-items:start}
.rep-list li:first-child{border-top:0}
.note{margin-top:4px;color:var(--bad)}
.signoff{margin-top:22px;padding-top:14px;border-top:1.5px solid var(--line-soft);font-size:.92rem;color:var(--muted);display:flex;gap:8px}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ph{position:relative;margin:0;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--soft)}
.ph img{width:100%;height:100%;object-fit:cover}
.stamp{position:absolute;left:0;right:0;bottom:0;background:rgba(10,16,22,.78);color:#fff;font-size:.74rem;line-height:1.35;padding:5px 8px;font-variant-numeric:tabular-nums}
.ph.empty{border:2px dashed var(--line);background:transparent;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;padding:10px;text-align:center}
.ph.empty span{font-size:.9rem;font-weight:700}
.ph-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.retake{position:absolute;top:6px;right:6px;font:inherit;font-size:.8rem;font-weight:700;border:0;border-radius:4px;background:rgba(10,16,22,.78);color:#fff;padding:5px 9px;cursor:pointer}

/* Verifier app */
.phone{max-width:500px;margin:0 auto}
.signed{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
select,textarea,input[type="text"],input[type="number"]{font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:10px 12px;min-height:48px}
textarea{width:100%;resize:vertical;margin-top:8px}
.job-title{font-size:2.2rem;margin:4px 0 6px}
.block{background:var(--surface);border:2px solid var(--line-soft);border-radius:6px;padding:18px;margin-top:14px}
.block h2{font-size:1.4rem;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.chk{padding:14px 0;border-top:1.5px solid var(--line-soft)}
.chk:first-of-type{border-top:0}
.chk-q{font-weight:700}
.seg{display:flex;gap:8px;margin-top:10px}
.seg button{flex:1;font:inherit;font-weight:700;min-height:50px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"][data-val="pass"]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-val="issue"]{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button[aria-pressed="true"][data-val="na"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.prog{display:flex;align-items:center;gap:14px}
.prog input{flex:1;accent-color:var(--ok);height:28px}
.prog output{font-family:var(--head);font-weight:700;font-size:1.6rem;min-width:64px;text-align:right}
.missing{margin:16px 0 10px;color:var(--bad)}
.missing ul{margin:4px 0 0;padding-left:20px}
.ready-msg{margin:16px 0 10px;color:var(--ok);font-weight:700}
.job-card{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;display:block}
.job-card:hover{border-color:var(--ink)}
.job-card strong{font-size:1.1rem}

/* Review desk */
.review{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:28px;align-items:start}
@media (max-width:900px){.review{grid-template-columns:1fr}}
.review-side h2{font-size:1.35rem;margin:24px 0 6px}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:10px;padding:6px 0;align-items:flex-start}
.tick{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--ok)}
.tick.no{background:var(--bad)}

/* Modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,14,20,.6);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--surface);color:var(--ink);border-radius:8px;width:100%;max-width:780px;max-height:100%;overflow:auto;padding:26px;position:relative;border-top:8px solid var(--sign)}
.sheet.narrow{max-width:560px}
.sheet > h2{font-size:1.9rem;padding-right:48px}
.x{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:6px;border:2px solid var(--line-soft);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line-soft);border-radius:6px;padding:14px;margin-top:10px;cursor:pointer}
.opt:has(input:checked){border-color:var(--ink);background:var(--bg)}
.opt input{margin-top:5px;width:20px;height:20px;accent-color:var(--navy)}
.opt strong{display:block}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:16px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
.field input,.field select{width:100%}
.modal-sub{font-size:1.35rem;margin:22px 0 6px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:#16212B;color:#fff;padding:14px 20px;border-radius:6px;border-left:6px solid var(--sign);font-weight:700;z-index:60;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{max-width:1200px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.9rem;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
.linkish{font:inherit;background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;font-weight:700}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.o7{order:7}
/* Score dial */
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px;border-radius:6px;background:var(--bg);margin:4px 0 6px}
.dial{--c:var(--ok);width:104px;height:104px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p) * 1%), var(--line-soft) 0)}
.dial span{width:80px;height:80px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:2rem;line-height:1}
.dial small{display:block;font-family:var(--body);font-size:.72rem;font-weight:400;color:var(--muted)}
.dial.fair{--c:#D99A00}.dial.poor{--c:var(--bad)}
.band{font-family:var(--head);font-weight:700;font-size:1.6rem;line-height:1.1}
.band.good{color:var(--ok)}.band.poor{color:var(--bad)}
.score-txt{flex:1;min-width:200px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.85rem;color:var(--muted);margin:8px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* Evidence groups: one photo and the items it proves */
.evi{display:grid;grid-template-columns:minmax(170px,230px) 1fr;gap:16px;padding:18px 0;border-top:1.5px solid var(--line-soft)}
.evi:first-of-type{border-top:0}
@media (max-width:620px){.evi{grid-template-columns:1fr}}
.evi h4{margin:0 0 6px;font-family:var(--head);font-size:1.2rem;font-weight:700}
.ck{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:8px 0;align-items:start}
.box{width:28px;height:28px;border-radius:4px;display:grid;place-items:center;border:2px dashed var(--line);color:var(--muted);font-weight:700}

      img.onload = () => { const max = SYNC.on ? 640 : 900, sc = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");

  if(st === "disputed") return {tone:"", icon:"help", text:"Report under review by a senior surveyor"};
  if(st === "fixing") return {tone:"", icon:"lock", text:`Payment on hold: fixes due ${activeFix(p, cur.id).due}`};
  if(st === "fixed") return {tone:"wait", icon:"calendar", text:"Fixed: book the re-check visit"};
  if(st === "booked") return {tone:"", icon:"calendar", text:`${VERIFIERS[v.verifierId].name} visits ${v.scheduled.replace(/ \d{4},/, ",")}`};
  if(st === "onsite") return {tone:"", icon:"hardhat", text:"Surveyor on site now"};

  const pr = pendingReq(p, cur.id); if(pr) return {tone:"", icon:"clock", text:`Waiting for ${VERIFIERS[pr.sid].name} to accept`};

/* ---------- Render ---------- */
function render(){
  const signing = needSignIn();
  document.body.classList.toggle("is-client", ui.role === "client" && !signing);
  document.body.classList.toggle("no-bar", !DEMO || !!LOCALSET.hideBar);
  setTimeout(translatePage, 0);
  renderChrome();
  const app = document.getElementById("app");
  if(signing){ app.innerHTML = viewSignIn(); renderModal(); return; }
  if(ui.role === "presenter"){ app.innerHTML = viewPresenter(); renderModal(); return; }
  if(ui.role === "client"){ const p = ui.page === "project" && pById(ui.pid); app.innerHTML = ui.page === "people" ? viewPeople() : ui.page === "messages" ? viewMessages() : ui.page === "help" ? viewHelp() : p ? viewProject(p) : viewHome(); }
  else app.innerHTML = ui.role === "verifier" ? viewVerifier() : viewReview();
  renderModal();
}

    const p = { id:"p" + (S.nextId++), type:ty, name, town, county: county + " County", plot:"Not entered yet", contractor, nca:ty === "build" ? "NCA grade not checked yet" : "", budget, amounts, paid:{} };
    SITE[p.id] = "-1.28640, 36.81720"; S.projects.push(p); ui.modal = null; ui.page = "project"; ui.pid = p.id;
    commit(`Added. Book the ${MS(p)[0].name.toLowerCase()} to begin.`); window.scrollTo(0, 0); },
  close(){ ui.modal = null; renderModal(); },

    post(v.requestId ? reqThread({id:v.requestId}) : "updates", "system", `${VERIFIERS[v.verifierId].name} checked in at ${p.town}.`); commit("Checked in."); },
  mark(d){ const v = vById(d.vid); v.checklist[d.item] = d.val; if(d.val !== "fail"){ delete v.reasons[d.item]; delete ip(v)[d.item]; } save(); keepScroll(render); },
  sampleIssue(d){ const v = vById(d.vid); ip(v)[d.item] = {kind:"demo", art:d.art, stage:+d.stage, defect:true, stamp:`${now()}\n${SITE[v.projectId] || ""}`}; save(); keepScroll(render); },
  retakeIssue(d){ const v = vById(d.vid); delete ip(v)[d.item]; save(); keepScroll(render); },
  reason(d){ const v = vById(d.vid), list = v.reasons[d.item] || (v.reasons[d.item] = []), i = list.indexOf(d.r); if(i >= 0) list.splice(i, 1); else list.push(d.r); save(); keepScroll(render); },
  sample(d){ const v = vById(d.vid); v.photos[d.spot] = {kind:"demo", art:d.art, stage:+d.stage, stamp:`${now()}\n${SITE[v.projectId] || ""}`}; save(); keepScroll(render); },
  retake(d){ const v = vById(d.vid); delete v.photos[d.spot]; save(); keepScroll(render); },
  submit(d){ const v = vById(d.vid); if(missing(v).length) return; v.status = "submitted"; v.submittedAt = now(); ui.vVisit = null;
    post(v.requestId ? reqThread({id:v.requestId}) : "updates", "system", `${VERIFIERS[v.verifierId].name} finished the visit. The report is with our review desk.`); commit("Sent to the review desk."); window.scrollTo(0, 0); },
  rtab(d){ ui.rtab = d.v; ui.rVisit = null; render(); },
  closeReview(){ ui.rVisit = null; render(); window.scrollTo(0, 0); },
  openReview(d){ ui.rVisit = d.vid; render(); },
  rqual(d){ ui.rq = ui.rq || {}; ui.rq[d.k] = ui.rq[d.k] === false; keepScroll(render); },
  payAll(){ const due = S.visits.filter(v => v.status === "approved" && ensureVisitRecord(v).payout.status === "processing");
    due.forEach(v => { v.payout = { status:"paid", on:today(), ref:payRef(v.id + today()), method:"M-Pesa" }; });
    commit(due.length ? `Paid ${due.length} ${due.length > 1 ? "professionals’ fees" : "professional’s fee"} by M-Pesa.` : "Nothing waiting to be paid."); },
  approve(d){ const v = vById(d.vid); v.status = "approved"; v.reviewNote = (v.reviewNoteDraft || "").trim(); v.reviewNoteDraft = ""; v.reviewedAt = now(); v.reviewer = REVIEWER; ui.rVisit = null;
    v.history = (v.history || []).concat([{ at:now(), by:REVIEWER, outcome:"approved", note:v.reviewNote }]);
    v.quality = Object.fromEntries(QUAL.map(([k]) => [k, !(ui.rq && ui.rq[k] === false)])); ui.rq = null;
    v.payout = { status:"processing", due:nextPayDay() };
    if(v.type === "onsite") ui.shot[v.projectId] = null;
    if(v.recheck){ const p = pById(v.projectId), f = fx(p).find(x => x.id === v.fixOf), old = f && vById(f.vid);
      if(f){ f.status = "done"; } if(old && band(v).k === "good") old.resolved = `Fixed by the contractor and re-checked by ${VERIFIERS[v.verifierId].name} on ${today()}.`; }
    { const p = pById(v.projectId), m = mById(v.milestoneId), b = band(v);
      post("updates", "macho", `Report ready: ${m.name} at your ${p.name.toLowerCase()} in ${p.town}. Scored ${scoreOf(v)} out of 100. ${b.t}.`, {vid:v.id, read:false}); }
    commit("Approved. The client can now read the report."); },
  sendBack(d){ const v = vById(d.vid), note = (v.reviewNoteDraft || "").trim();
    if(!note){ toast("Add a note telling the surveyor what to fix."); return; }
    v.status = "returned"; v.reviewNote = note; v.reviewNoteDraft = ""; v.reviewedAt = now(); ui.rVisit = null; ui.rq = null;
    v.history = (v.history || []).concat([{ at:now(), by:REVIEWER, outcome:"returned", note }]); commit("Sent back to the professional."); },
  reset(){
    if(SYNC.on && !ui.resetArmed){ ui.resetArmed = true; toast("This resets the demo for everyone using this link. Tap Reset demo data again to confirm."); setTimeout(() => { ui.resetArmed = false; }, 6000); return; }
    S = seed(); ui = { thread:null, mf:"all", role:"client", page:"home", pid:null, shot:{}, modal:null, signedIn:"v1", vVisit:null, rVisit:null, f:{role:"all", exp:0, county:"any", sort:"exp"} }; commit("Demo data reset."); window.scrollTo(0, 0); }
};
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if(!el) return; const fn = actions[el.dataset.act]; if(fn) fn(el.dataset, el, e); });
document.addEventListener("input", e => {
  const t = e.target, f = t.dataset.field; if(!f) return; const v = t.dataset.vid ? vById(t.dataset.vid) : null;
  if(f === "other"){ v.other[t.dataset.item] = t.value; save(); refreshMissing(v); }
  else if(f === "progress"){ v.progress = +t.value; const o = document.getElementById("progOut"); if(o) o.textContent = t.value + "%"; save(); }
  else if(f === "summary"){ v.summary = t.value; save(); }
  else if(f === "reviewNote"){ v.reviewNoteDraft = t.value; save(); }
  else if(f === "fixNote" && ui.modal){ ui.modal.note = t.value; }
  else if(f === "rqNote" && ui.modal){ ui.modal.note = t.value; }
  else if(f === "dsText" && ui.modal){ ui.modal.text = t.value; }
  else if(f === "pinDir" && ui.modal){ ui.modal.dir = t.value; }
  else if(f === "pinGate" && ui.modal){ ui.modal.gate = t.value; }
  else if(f === "pinPaste" && ui.modal){ ui.modal.paste = t.value; const ok = !!parseCoords(t.value), b = document.querySelector("[data-act=pinSend]"); if(b) b.disabled = !ok; if(ok){ clearTimeout(window.__pinT); window.__pinT = setTimeout(() => { renderModal(); const i = document.querySelector("[data-field=pinPaste]"); if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 500); } }
});
document.addEventListener("change", async e => {
  const t = e.target, f = t.dataset.field; if(!f) return;
  if(f === "photo"){ const file = t.files && t.files[0]; if(!file) return;
    try{ const src = await readPhoto(file), v = vById(t.dataset.vid); v.photos[t.dataset.spot] = {kind:"img", src, stamp:`${now()}\n${SITE[v.projectId] || ""}`}; save(); keepScroll(render); }
    catch(err){ toast("That photo couldn’t be read. Try a different one."); } }
  else if(f === "issuePhoto"){ const file = t.files && t.files[0]; if(!file) return;
    try{ const src = await readPhoto(file), v = vById(t.dataset.vid); ip(v)[t.dataset.item] = {kind:"img", src, stamp:`${now()}\n${SITE[v.projectId] || ""}`}; save(); keepScroll(render); }
    catch(err){ toast("That photo couldn’t be read. Try a different one."); } }
  else if(f === "signedIn"){ ui.signedIn = t.value; ui.vVisit = null; ui.vTab = null; ui.declining = null; render(); }
  else if(f === "bookType"){ ui.modal.type = t.value; renderModal(); }
  else if(f === "fixItem"){ const l = ui.modal.items, i = l.indexOf(t.value); if(t.checked && i < 0) l.push(t.value); if(!t.checked && i >= 0) l.splice(i, 1); renderModal(); }
  else if(f === "fixDue"){ ui.modal.due = +t.value; renderModal(); }
  else if(f === "setBar"){ LOCALSET.hideBar = !t.checked; try{ localStorage.setItem("macho-settings", JSON.stringify(LOCALSET)); }catch(e){} render(); }
  else if(f === "siCc"){ ui.si.cc = t.value; }
  else if(f.startsWith("set_")){ SET()[f.slice(4)] = t.checked; save(); renderChrome(); }
  else if(f === "npType"){ const keep = {}; ["np-name","np-town","np-county","np-contractor","np-budget"].forEach(id => { const e = document.getElementById(id); if(e) keep[id] = e.value; });
    ui.modal.type = t.value; renderModal(); Object.entries(keep).forEach(([id, v]) => { const e = document.getElementById(id); if(e) e.value = v; }); }
  else if(f === "fSvc"){ ui.f.svc = t.value; ui.f.role = "all"; render(); }
  else if(f === "pinSrc"){ ui.modal.src = t.value; renderModal(); }
  else if(f === "fmAccess"){ ui.modal.access = t.value; }

  else if(f === "dsItem"){ const l = ui.modal.items, i = l.indexOf(t.value); if(t.checked && i < 0) l.push(t.value); if(!t.checked && i >= 0) l.splice(i, 1); }
  else if(f === "dsWant"){ ui.modal.want = t.value; }
  else if(f === "chatPhoto"){ const file = t.files && t.files[0]; if(!file) return; const th = t.dataset.t;
    readPhoto(file).then(src => { const box = document.getElementById("composer"); post(th, "client", box ? box.value.trim() : "", {img:{kind:"img", src}}); save(); render(); scrollMsgs(); }).catch(() => toast("That photo couldn’t be read. Try a different one.")); }
  else if(f === "fRole"){ ui.f.role = t.value; render(); } else if(f === "fExp"){ ui.f.exp = +t.value; render(); }
  else if(f === "fCounty"){ ui.f.county = t.value; render(); } else if(f === "fSort"){ ui.f.sort = t.value; render(); }
  else if(f === "rqProject"){ ui.modal.pid = t.value; ui.modal.type = null; renderModal(); }
  else if(f === "rqType"){ ui.modal.type = t.value; renderModal(); }

});
const HASH = { client:"client", verifier:"pro", review:"review", presenter:"demo" };
function setHash(){ const h = needSignIn() ? "signin" : HASH[ui.role]; if(location.hash.slice(1) !== h){ try{ history.replaceState(null, "", "#" + h); }catch(e){ try{ location.hash = h; }catch(e2){} } } }
function fromHash(){ const h = (location.hash || "").slice(1);
  if(h === "signin"){ if(!needSignIn()){ ui.forceSignIn = true; ui.si = null; render(); } return; }
  let r = Object.keys(HASH).find(k => HASH[k] === h);
  if(r === "presenter" && !DEMO) r = null;
  if(!DEMO && SESSION) r = SESSION.role;
  if(!DEMO && !SESSION){ if(r && r !== "presenter") ui.siWanted = r; render(); return; }
  if(r && DEMO && ui.forceSignIn){ ui.forceSignIn = false; ui.si = null; if(r === ui.role){ render(); return; } }
  if(r && r !== ui.role){ ui.role = r; ui.modal = null; if(r === "verifier"){ ui.vTab = null; const q = reqs().filter(x => x.status === "pending").slice(-1)[0]; if(q) ui.signedIn = q.sid; } render(); } }
window.addEventListener("hashchange", fromHash);
if(SESSION && !DEMO){ ui.role = SESSION.role; if(SESSION.role === "verifier") ui.signedIn = SESSION.sid; }
fromHash();
wireCaps();
startSync();
document.addEventListener("keydown", e => { if(e.key === "Escape" && ui.modal){ ui.modal = null; renderModal(); } });
